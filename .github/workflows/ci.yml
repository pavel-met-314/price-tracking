name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    # Публикация релиза пишет в репозиторий, поэтому права на запись — только у этой работы:
    # весь workflow по-прежнему читает код.
    permissions:
      contents: write
    timeout-minutes: 30

    # Без явного bash GitHub запускает steps как `bash -e {0}` (без pipefail), и любой
    # конвейер с tee проглатывает код ошибки Gradle: шаг «зелёный», а сборка упала.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Образ runner'а уже содержит Android SDK; доставляем только то, чего нет,
      # иначе compileSdk 36 падает на «Failed to find target with hash string».
      - name: Install Android SDK packages
        run: |
          for pkg in "platforms;android-36" "build-tools;36.0.0" "platform-tools"; do
            if ! sdkmanager --list_installed 2>/dev/null | grep -qF "$pkg"; then
              yes | sdkmanager "$pkg" >/dev/null 2>&1 || echo "skip $pkg"
            fi
          done

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee /tmp/tests.log

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee /tmp/assemble.log

      # GitHub отдаёт текст логов только с правом actions:read, а аннотации — нет.
      # Поэтому ошибки компиляции дублируются аннотациями: их видно в Check Runs API
      # и в интерфейсе PR, и этого достаточно, чтобы разобрать падение.
      - name: Publish errors as annotations
        if: always()
        run: |
          log=""
          if [ -s /tmp/assemble.log ]; then
            log=/tmp/assemble.log
          elif [ -s /tmp/tests.log ]; then
            log=/tmp/tests.log
          fi
          if [ -z "$log" ]; then
            exit 0
          fi
          if ! grep -qE "BUILD FAILED|^e: |error:" "$log"; then
            exit 0
          fi
          # Отдельный файл вместо конвейера с head: иначе pipefail + SIGPIPE дают
          # несущественный код 141 и шаг «падает», пряча настоящую причину.
          grep -E "^e: |^FAILURE:|FAILED|error:|Caused by:|Execution failed" "$log" > /tmp/errors.txt || true
          if [ ! -s /tmp/errors.txt ]; then
            echo "::error::Gradle завершился с ошибкой, шаблон не совпал — смотрите полный лог"
            exit 0
          fi
          # Ограничение по байтам, а не по строкам через pipe: head в конвейере
          # под pipefail обрывает запись с кодом 141 и тонит шаг без причины.
          head -c 4000 /tmp/errors.txt > /tmp/errors.trim
          while IFS= read -r line; do
            echo "::error::${line}"
          done < /tmp/errors.trim
          # Подробности компиляции (список подходящих сигнатур и т. п.) идут после «e:»
          # без префикса и в аннотации не попадают — собираем их в одну строку.
          if grep -qE "^e: " "$log"; then
            grep -A 8 -m 1 -E "^e: " "$log" | tr '\n' ' ' | tr -s ' ' \
              | sed 's/%/%25/g' | head -c 1500 > /tmp/detail.txt || true
            if [ -s /tmp/detail.txt ]; then
              echo "::error::контекст: $(cat /tmp/detail.txt)"
            fi
          fi

      # Сообщения проваленных утверждений: Gradle печатает в консоли только имя теста, а
      # expected/actual лежат в XML-отчёте. Логи артефактов при удалённой отладке недоступны
      # (их отдаёт внешнее хранилище), поэтому текст достаётся отсюда и публикуется аннотациями:
      # их видно в Check Runs API и в интерфейсе PR.
      - name: Test failure details as annotations
        if: always()
        run: |
          files=$(find app/build/test-results -name "*.xml" 2>/dev/null | tr '\n' ' ')
          if [ -z "$files" ]; then
            exit 0
          fi
          python3 - $files <<'PY' > /tmp/fails.txt || true
          import html, re, sys

          for path in sys.argv[1:]:
              src = open(path, encoding="utf-8", errors="replace").read()
              # Проход по кускам, а не парами «testcase…failure»: успешные тесты записаны
              # самозакрывающимся тегом, и поиск по «<testcase>…</testcase>» сдвигает сообщение
              # на чужой тест — по такому «диагнозу» можно починить не то.
              for chunk in re.split(r"<testcase\b", src)[1:]:
                  name = re.search(r'name="([^"]+)"', chunk)
                  failure = re.search(r'<failure[^>]*message="([^"]*)"', chunk)
                  if not name or not failure:
                      continue
                  text = html.unescape(failure.group(1)).replace("\n", " | ")
                  print(name.group(1) + " => " + text[:450])
          PY
          if [ ! -s /tmp/fails.txt ]; then
            exit 0
          fi
          sed 's/%/%25/g' /tmp/fails.txt > /tmp/fails.esc
          while IFS= read -r line; do
            echo "::error::${line}"
          done < /tmp/fails.esc

      # Имя файла APK у разных версий AGP различается (app-debug.apk / app_debug.apk),
      # поэтому ищем по дереву outputs и печатаем результат аннотацией.
      - name: Locate APK
        if: success()
        run: |
          set +e
          files=$(find . -name "*.apk" -not -path "./.git/*" | tr '\n' ' ')
          echo "::notice::APK: ${files:-не найден — сборка прошла, но упаковка не создала файл}"

      - name: Build release APK (нужен для публикации в RuStore)
        env:
          # Секретов может не быть (форк или локальный прогон без ключа) — шаг тогда ничего не делает:
          # debug-путь и тесты от этого не зависят.
          OTSLED_RELEASE_KEYSTORE_BASE64: ${{ secrets.OTSLED_RELEASE_KEYSTORE_BASE64 }}
          OTSLED_RELEASE_STORE_FILE: ${{ runner.temp }}/otsled-release.keystore
          OTSLED_RELEASE_STORE_PASSWORD: ${{ secrets.OTSLED_RELEASE_STORE_PASSWORD }}
          OTSLED_RELEASE_KEY_ALIAS: ${{ secrets.OTSLED_RELEASE_KEY_ALIAS }}
          OTSLED_RELEASE_KEY_PASSWORD: ${{ secrets.OTSLED_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "${OTSLED_RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::notice::ключа релиза нет — release не собирается (для debug-прогонов это норма)"
            exit 0
          fi
          printf '%s' "$OTSLED_RELEASE_KEYSTORE_BASE64" | base64 -d > "$OTSLED_RELEASE_STORE_FILE"
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: otsled-debug
          path: |
            **/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      # Постоянная ссылка на последнюю сборку: открывается в браузере телефона и скачивается
      # одним тапом — без архивов, пересылок и распаковки. Только на push: у токена pull_request
      # нет прав на релизы, и шаг падал бы на PR, пряча настоящую причину.
      - name: Publish APK to GitHub Release (latest)
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Путь именно debug/: с появлением release-сборки «первый apk в дереве» мог оказаться
          # магазинным — и уехал бы в релиз под именем app-debug.apk.
          apk=$(find . -path "*/outputs/apk/debug/*" -name "*.apk" | head -1)
          set -e
          if [ -z "$apk" ]; then
            echo "::error::APK не найден — публиковать нечего"
            exit 1
          fi
          cp "$apk" /tmp/app-debug.apk
          release_apk=$(find . -path "*/outputs/apk/release/*" -name "*.apk" | head -1)
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then version="?"; fi
          # Кроме «всегда последней» ссылки держим именованный ассет: его не перезапишет следующий
          # прогон, и конкретную сборку можно поставить позже. Для самообновления это решающе —
          # чтобы увидеть «доступна 1.4», надо уметь остаться на 1.3.
          assets="/tmp/app-debug.apk"
          if [ "$version" != "?" ]; then
            cp "$apk" "/tmp/app-debug-$version.apk"
            assets="/tmp/app-debug.apk /tmp/app-debug-$version.apk"
          fi
          # В магазин идёт подписанный release. AGP называет неподписанный файл app-release-unsigned.apk,
          # и по имени это видно надёжно любого разбора: выкладывать такое в релиз нельзя — приложение
          # на магазинной сборке ищет app-release.apk и получило бы APK, который не устанавливается.
          release_published=0
          case "$release_apk" in
            ""|*-unsigned.apk)
              echo "::notice::подписанного release APK нет — в релизе будет только debug"
              ;;
            *)
              cp "$release_apk" /tmp/app-release.apk
              assets="$assets /tmp/app-release.apk"
              if [ "$version" != "?" ]; then
                cp "$release_apk" "/tmp/app-release-$version.apk"
                assets="$assets /tmp/app-release-$version.apk"
              fi
              release_published=1
              ;;
          esac
          notes=/tmp/release-notes.md
          {
            printf 'Последняя debug-сборка: %s, коммит `%s`.\n\n' "$version" "${GITHUB_SHA:0:7}"
            printf 'Как поставить: скачать файл, открыть, при запросе разрешить установку этому приложению — разрешение выдаётся один раз.\n'
            if [ "$version" != "?" ]; then
              printf 'Именно эта версия, её не перезапишет следующий прогон: https://github.com/%s/releases/download/latest/app-debug-%s.apk\n' "$GITHUB_REPOSITORY" "$version"
            fi
            if [ "$release_published" = "1" ]; then
              printf 'Для магазина: app-release.apk (и app-release-%s.apk) — подписан release-ключом, ставится только поверх магазинной сборки.\n' "$version"
            fi
            printf 'Обновление ставится поверх: все прогоны подписывают одним ключом app/debug.keystore.\n'
          } > "$notes"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Последняя сборка ($version)" --notes-file "$notes"
            gh release upload latest $assets --clobber
          else
            gh release create latest $assets \
              --title "Последняя сборка ($version)" --notes-file "$notes" --target "$GITHUB_SHA"
          fi
          echo "::notice::APK: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/app-debug.apk"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
